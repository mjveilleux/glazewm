general:
  hide_method: 'cloak'
gaps:
  inner_gap: '10px'
  outer_gap: { top: '10px', right: '10px', bottom: '10px', left: '10px' }
workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
# Colored borders, so focus changes show the border animation.
window_effects:
  focused_window:
    border: { enabled: true, color: '#ff8a3d' }
  other_windows:
    border: { enabled: true, color: '#3d7aff' }
animations:
  enabled: true
  beziers:
    # Overshoots its target a little before settling, to show in the sheets.
    overshoot: [0.05, 0.9, 0.1, 1.05]
  windows:
    duration_ms: 600
    easing: 'ease_out_quint'
  windows_in:
    style: 'slide'
    duration_ms: 600
    easing: 'ease_out_cubic'
  windows_out:
    style: 'gnomed'
    duration_ms: 480
  fade:
    duration_ms: 600
  windows_move:
    style: 'slide'
    easing: 'overshoot'
    trigger_threshold: '10px'
  workspaces:
    style: 'slide'
    duration_ms: 600
  border:
    duration_ms: 600
