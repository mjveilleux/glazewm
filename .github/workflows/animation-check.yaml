name: Animation check

# Runs GlazeWM with window animations on a Windows desktop, records the screen while windows
# open, close and reflow, and uploads the frames (scripts/animation-check.ps1). The contact
# sheets (one image per step), checks and logs also go to the branch ci/animation-check--<branch>
# (slashes made dashes), so they can be read with git alone.
on:
  push:
    branches: ['claude/**', 'omawin']
    paths: ['packages/**', 'scripts/animation-*', '.github/workflows/animation-check.yaml']
  workflow_dispatch:
    inputs:
      duration_ms:
        description: Animation duration (slowed so the recording catches several frames).
        default: '600'

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: nightly

      - uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: animation-check-${{ hashFiles('Cargo.lock') }}

      - name: Build
        shell: bash
        run: cargo build --locked --release -p wm -p wm-cli

      # ffmpeg (from imageio-ffmpeg) records the screen at up to 60 fps while each run plays, for
      # videos smooth enough to judge the motion by.
      - name: Set up ffmpeg
        shell: bash
        run: |
          python -m pip install --quiet pillow imageio-ffmpeg
          echo "FFMPEG=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"

      - name: Record animations (slowed)
        shell: pwsh
        run: ./scripts/animation-check.ps1 -DurationMs ${{ inputs.duration_ms || '600' }}

      # Again at omawin's own timings (glazewm/config.yaml there), for a video at real speed.
      - name: Record animations (real speed)
        if: always()
        shell: pwsh
        run: ./scripts/animation-check.ps1 -Out out-real -DurationMs 200 -OpenMs 150 -CloseMs 160

      # Animations off (animations.enabled: false, settings kept): nothing may animate, and no
      # overlay may appear.
      - name: Record with animations off
        if: always()
        shell: pwsh
        run: ./scripts/animation-check.ps1 -Out out-off -DurationMs 200 -Disabled

      - name: Contact sheets and videos
        if: always()
        shell: bash
        run: |
          mkdir -p results
          if [ -d out/frames ]; then python scripts/animation-sheets.py out results/sheets 16; fi
          if [ -d out/frames ]; then python scripts/animation-video.py out results/slowed.mp4 'slowed: 600 ms'; fi
          if [ -d out-real/frames ]; then python scripts/animation-video.py out-real results/real-speed.mp4 'real speed: 200 ms slides, 150 ms fade'; fi
          if [ -d out-real/frames ]; then python scripts/animation-video.py out-real results/real-speed-half.mp4 'real speed, played at half speed' 0.5; fi
          if [ -f out/screen.mp4 ]; then cp out/screen.mp4 results/screen-slowed.mp4; fi
          if [ -f out-real/screen.mp4 ]; then cp out-real/screen.mp4 results/screen-real-speed.mp4; fi
          cp out/*.txt out/*.log out/*.json out/config.yaml results/ 2>/dev/null || true

      # One results branch per source branch (ci/animation-check--claude-foo for
      # claude/foo), so runs of different branches never overwrite each other.
      - name: Publish to ci/animation-check--<branch>
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SOURCE: ${{ github.ref_name }}
        run: |
          target="ci/animation-check--${SOURCE//\//-}"
          cd results
          git init -q
          git checkout -q -b "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Animation check: run ${{ github.run_id }} on ${{ github.sha }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" "$target"

      - name: Upload recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation-check
          path: |
            out/
            out-real/
            out-off/
          retention-days: 7
