name: Flash spike

# Experiment on the new-window flash (scripts/flash-spike.ps1): which ways of hiding a window keep it
# off screen from the moment it's shown. Results go to ci/flash-spike--<branch>.
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/flash-spike.ps1', '.github/workflows/flash-spike.yaml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up ffmpeg
        shell: bash
        run: |
          python -m pip install --quiet imageio-ffmpeg
          echo "FFMPEG=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"

      - name: Spike
        shell: pwsh
        run: ./scripts/flash-spike.ps1

      - name: Publish to ci/flash-spike--<branch>
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SOURCE: ${{ github.ref_name }}
        run: |
          target="ci/flash-spike--${SOURCE//\//-}"
          mkdir -p out-flash
          cd out-flash
          git init -q
          git checkout -q -b "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Flash spike: run ${{ github.run_id }} on ${{ github.sha }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" "$target"
